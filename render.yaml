# Render Blueprint — alternative host for the Next.js app (production currently
# runs on Vercel from `main`; see brain/Architecture.md). DB + Auth stay on
# Supabase. Set the secret env vars (sync:false) in the host dashboard.
services:
  - type: web
    name: launchmap
    runtime: node
    region: frankfurt
    # free tier (spins down when idle). Bump to "starter" ($7/mo) for always-on.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL_ANALYZE
        value: claude-haiku-4-5-20251001
      - key: ANTHROPIC_MODEL_DRAFT
        value: claude-sonnet-4-6
      - key: PLATEGA_MERCHANT_ID
        sync: false
      - key: PLATEGA_SECRET
        sync: false
      - key: PLATEGA_RUB_PER_USD
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: URL_CACHE_HOURS
        value: "24"
